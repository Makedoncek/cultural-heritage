# Render Blueprint — backend on the free tier (no Redis / worker / cron / shell).
# Celery tasks run in-request (CELERY_TASK_ALWAYS_EAGER), email goes through the
# Brevo HTTP API (SMTP ports are blocked), periodic tasks are triggered daily by
# .github/workflows/maintenance.yml. Values marked `sync: false` are prompted for
# on first Blueprint sync.
services:
  - type: web
    name: culturemap-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # No shell / pre-deploy on the free tier: migrations and the admin account are handled at start.
    startCommand: python manage.py migrate --noinput && python manage.py ensure_superuser && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # External Postgres (e.g. Neon / Supabase) — Render's free Postgres expires after 30 days.
      - key: DATABASE_URL
        sync: false
      # Vercel frontend origin, e.g. https://culturemap.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Email via Brevo; DEFAULT_FROM_EMAIL must be a sender verified in Brevo,
      # e.g. "CultureMap <you@gmail.com>".
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MAINTENANCE_TOKEN
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ORS_API_KEY
        sync: false
