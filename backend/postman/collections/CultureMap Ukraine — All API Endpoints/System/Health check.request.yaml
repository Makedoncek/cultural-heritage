$kind: http-request
url: "{{baseUrl}}/api/health/"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has status field', () => pm.expect(pm.response.json()).to.have.property('status'));
    language: text/javascript
order: 1000
