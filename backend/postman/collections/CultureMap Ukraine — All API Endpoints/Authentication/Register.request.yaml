$kind: http-request
description: Creates inactive user, sends verification email.
url: "{{baseUrl}}/api/auth/register/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "newuser123",
      "email": "newuser123@example.com",
      "password": "SecurePass123!",
      "password2": "SecurePass123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
