$kind: http-request
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
    - type: text
      key: caption
      value: Тестовий підпис
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const data = pm.response.json();
      if (data.id) pm.collectionVariables.set('photoId', data.id);
    language: text/javascript
order: 1000
