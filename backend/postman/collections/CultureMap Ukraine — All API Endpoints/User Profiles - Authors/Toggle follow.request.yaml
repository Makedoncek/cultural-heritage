$kind: http-request
url: "{{baseUrl}}/api/users/{{username}}/follow/"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has is_followed', () => pm.expect(pm.response.json()).to.have.property('is_followed'));
    language: text/javascript
order: 3000
