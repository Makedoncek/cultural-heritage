$kind: http-request
url: "{{baseUrl}}/api/objects/{{objectId}}/"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has photos array', () => pm.expect(pm.response.json()).to.have.property('photos'));
    language: text/javascript
order: 2000
