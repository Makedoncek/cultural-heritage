$kind: http-request
description: Send password reset email. Always returns 200 to prevent email enumeration.
url: "{{baseUrl}}/api/auth/password-reset/"
method: POST
auth:
  type: noauth
body:
  mode: raw
  raw: |-
    {
      "email": "{{email}}"
    }
  options:
    raw:
      language: json
order: 1500
