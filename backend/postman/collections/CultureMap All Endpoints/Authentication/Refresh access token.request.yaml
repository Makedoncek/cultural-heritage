$kind: http-request
description: Get new access token via refresh token. Refresh tokens are rotated.
url: "{{baseUrl}}/api/auth/refresh/"
method: POST
auth:
  type: noauth
body:
  mode: raw
  raw: |-
    {
      "refresh": "{{refreshToken}}"
    }
  options:
    raw:
      language: json
events:
  - listen: test
    script:
      exec: |
        pm.test('Status 200', () => pm.response.to.have.status(200));
        const data = pm.response.json();
        if (data.access) pm.collectionVariables.set('accessToken', data.access);
        if (data.refresh) pm.collectionVariables.set('refreshToken', data.refresh);
order: 1200
