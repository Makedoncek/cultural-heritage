$kind: http-request
description: Set new password using uid+token from reset email.
url: "{{baseUrl}}/api/auth/password-reset/confirm/"
method: POST
auth:
  type: noauth
body:
  mode: raw
  raw: |-
    {
      "uid": "PASTE_UID",
      "token": "PASTE_TOKEN",
      "password": "NewSecurePass123!",
      "password2": "NewSecurePass123!"
    }
  options:
    raw:
      language: json
order: 1600
