$kind: http-request
description: Authenticate user, get access+refresh JWT. Test-script saves both to collection variables.
url: "{{baseUrl}}/api/auth/login/"
method: POST
auth:
  type: noauth
body:
  mode: raw
  raw: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
  options:
    raw:
      language: json
events:
  - listen: test
    script:
      exec: |
        pm.test('Status 200', () => pm.response.to.have.status(200));
        const data = pm.response.json();
        if (data.access) pm.collectionVariables.set('accessToken', data.access);
        if (data.refresh) pm.collectionVariables.set('refreshToken', data.refresh);
        pm.test('Has access token', () => pm.expect(data).to.have.property('access'));
order: 1100
