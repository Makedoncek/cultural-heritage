$kind: http-request
description: Create inactive user account, send verification email.
url: "{{baseUrl}}/api/auth/register/"
method: POST
auth:
  type: noauth
body:
  mode: raw
  raw: |-
    {
      "username": "newuser123",
      "email": "newuser123@example.com",
      "password": "SecurePass123!",
      "password2": "SecurePass123!"
    }
  options:
    raw:
      language: json
events:
  - listen: test
    script:
      exec: |
        pm.test('Status 201', () => pm.response.to.have.status(201));
order: 1300
