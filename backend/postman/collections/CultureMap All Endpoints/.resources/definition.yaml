description: |
  # CultureMap Ukraine — REST API

  Повна колекція ендпоінтів для CultureMap (Django + DRF + JWT). 29 запитів у 6 папках.

  ## Швидкий старт

  1. **Запусти бекенд:** `cd backend && python manage.py runserver` (потрібні `db` + `redis` через `docker-compose up -d`).
  2. **Налаштуй змінні** (вкладка `Variables` цієї колекції):
     - `baseUrl` — корінь API (за замовчуванням `http://localhost:8000`)
     - `username` + `password` — облікові дані юзера для логіну
     - `objectId` / `tagId` / `photoId` / `email` — для відповідних запитів
  3. **Authentication → Login (JWT)** — тест-скрипт автоматично запише `accessToken` і `refreshToken` у Variables. Після цього решта запитів (з Bearer) одразу авторизовані.
  4. **Objects → Create object** оновлює `objectId`; **Photos → Upload photo** оновлює `photoId` — chaining-ready.

  ## Папки

  | Папка | Запитів | Опис |
  |---|---|---|
  | Authentication | 7 | Login/refresh, register, verify-email, password-reset, resend-verification |
  | System | 2 | Health, OpenAPI schema (debug-only) |
  | Tags | 2 | Read-only tag catalog |
  | Objects | 9 | CRUD + my, favorite, favorites-list, popular |
  | Photos (nested) | 5 | Upload, list, patch caption, reorder, delete |
  | User Profiles | 4 | Author profile, objects, follow toggle, followed-list |

  ## Ролі та доступ

  - **Anonymous** бачить публічні endpoints: list/retrieve approved objects, tags, popular, profile, list photos (approved only).
  - **Authenticated user** може створювати об'єкти, додавати у favorites, підписуватись на авторів, завантажувати фото до approved-об'єктів інших авторів (max 3 на об'єкт).
  - **Author** бачить свої pending/approved/archived об'єкти і фото.
  - **Admin** (`is_staff`) — повний доступ; модерує об'єкти і фото через Django admin.

  ## Throttling

  - Anonymous: `1000/година`
  - User: `5000/година`
  - Photo upload: `10/година/user`

  ## Bearer auth

  Колекція має дефолтний `bearer {{accessToken}}`. Public-endpoints явно перевизначають це на `noauth`.

auth:
  type: bearer
  bearer:
    token: "{{accessToken}}"

variables:
  baseUrl: http://localhost:8000          # корінь Django API
  accessToken: ""                          # JWT access (заповнюється авто після Login)
  refreshToken: ""                         # JWT refresh (заповнюється авто після Login)
  username: alecs7turbo                    # логін для входу і ID юзера у /users/{username}/
  password: SecurePass123!                 # пароль до акаунта
  email: test@example.com                  # email для password-reset / resend-verification
  objectId: "1"                            # PK об'єкта; оновлюється після Create object
  tagId: "1"                               # PK тега
  photoId: ""                              # PK фото; оновлюється після Upload photo
