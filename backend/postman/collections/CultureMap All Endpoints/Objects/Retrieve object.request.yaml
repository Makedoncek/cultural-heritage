$kind: http-request
description: Get full object detail including photos array and photo_count.
url: "{{baseUrl}}/api/objects/{{objectId}}/"
method: GET
auth:
  type: noauth
events:
  - listen: test
    script:
      exec: |
        pm.test('Status 200', () => pm.response.to.have.status(200));
        pm.test('Has photos array', () => pm.expect(pm.response.json()).to.have.property('photos'));
order: 4200
