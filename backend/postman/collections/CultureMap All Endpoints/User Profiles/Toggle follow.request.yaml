$kind: http-request
description: Subscribe/unsubscribe to author. Subscribers receive email when author publishes new approved object.
url: "{{baseUrl}}/api/users/{{username}}/follow/"
method: POST
events:
  - listen: test
    script:
      exec: |
        pm.test('Status 200', () => pm.response.to.have.status(200));
        pm.test('Has is_followed', () => pm.expect(pm.response.json()).to.have.property('is_followed'));
order: 6300
