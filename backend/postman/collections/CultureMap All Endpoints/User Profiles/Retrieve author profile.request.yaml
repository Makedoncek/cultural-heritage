$kind: http-request
description: Author profile (username, date_joined, approved_objects_count, total_favorites_received, followers_count, is_followed).
url: "{{baseUrl}}/api/users/{{username}}/"
method: GET
auth:
  type: noauth
events:
  - listen: test
    script:
      exec: |
        pm.test('Status 200', () => pm.response.to.have.status(200));
        pm.test('Has approved_objects_count', () => pm.expect(pm.response.json()).to.have.property('approved_objects_count'));
order: 6100
