$kind: http-request
description: Upload a photo (multipart). Saves photoId for downstream requests.
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/"
method: POST
auth:
  type: bearer
  bearer:
    token: "{{accessToken}}"
body:
  mode: formdata
  formdata:
    - key: image
      type: file
    - key: caption
      value: Test caption
      type: text
events:
  - listen: test
    script:
      exec: |
        pm.test("Status 201", () => pm.response.to.have.status(201));
        const data = pm.response.json();
        pm.test("Has image_url", () => pm.expect(data).to.have.property('image_url'));
        pm.test("Status pending", () => pm.expect(data.status).to.equal('pending'));
        pm.collectionVariables.set('photoId', data.id);
order: 1000
