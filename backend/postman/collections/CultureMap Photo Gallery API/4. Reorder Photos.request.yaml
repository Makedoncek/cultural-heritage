$kind: http-request
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/reorder/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"order": [{"id": {{photoId}}, "order": 0}]}'
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
