$kind: http-request
description: 11th upload within an hour from same user. Expect 429. Run "Upload Photo" 10 times first.
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/"
method: POST
auth:
  type: bearer
  bearer:
    token: "{{accessToken}}"
body:
  mode: formdata
  formdata:
    - key: image
      type: file
events:
  - listen: test
    script:
      exec: |
        pm.test("Status 429", () => pm.response.to.have.status(429));
order: 10000
