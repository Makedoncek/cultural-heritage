$kind: http-request
description: Upload without Authorization header. Expect 401.
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
