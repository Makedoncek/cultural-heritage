$kind: http-request
description: Update photo caption (uploader or admin only).
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/{{photoId}}/"
method: PATCH
auth:
  type: bearer
  bearer:
    token: "{{accessToken}}"
body:
  mode: raw
  raw: '{"caption": "Updated caption"}'
  options:
    raw:
      language: json
events:
  - listen: test
    script:
      exec: |
        pm.test("Status 200", () => pm.response.to.have.status(200));
        pm.test("Caption updated", () => pm.expect(pm.response.json().caption).to.equal('Updated caption'));
order: 3000
