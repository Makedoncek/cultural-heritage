$kind: http-request
description: Bulk reorder author photos.
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/reorder/"
method: POST
auth:
  type: bearer
  bearer:
    token: "{{accessToken}}"
body:
  mode: raw
  raw: '{"order": [{"id": {{photoId}}, "order": 0}]}'
  options:
    raw:
      language: json
events:
  - listen: test
    script:
      exec: |
        pm.test("Status 200", () => pm.response.to.have.status(200));
order: 4000
