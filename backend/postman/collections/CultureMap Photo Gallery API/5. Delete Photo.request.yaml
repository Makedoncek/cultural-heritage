$kind: http-request
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/{{photoId}}/"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
