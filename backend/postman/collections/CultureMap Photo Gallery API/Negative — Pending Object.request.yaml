$kind: http-request
description: Contributor uploads to pending object. Expect 403. Set objectId to a pending one not owned by current user.
url: "{{baseUrl}}/api/objects/{{objectId}}/photos/"
method: POST
auth:
  type: bearer
  bearer:
    token: "{{accessToken}}"
body:
  mode: formdata
  formdata:
    - key: image
      type: file
events:
  - listen: test
    script:
      exec: |
        pm.test("Status 403", () => pm.response.to.have.status(403));
order: 9000
